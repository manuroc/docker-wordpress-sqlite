; Redirect errors to the container stderr
error_log = "/dev/stderr"

; Make sure _ENV is populated to use it in wp-config.php
variables_order = "EGPCS"

; Hide PHP version info in response headers
expose_php = Off

; Up the upload limit
post_max_size = 50M
upload_max_filesize = 50M

; Increase default memory limit, required for Woocommce
memory_limit = 256M

[Date]
; Set default timezone, you can configure the timezone in Wordpress
date.timezone = "UTC"

;enable sqlite for the db
extension=pdo_sqlite.so
extension=sqlite3.so

;enable igbinary
extension=igbinary.so
session.serialize_handler=igbinary
igbinary.compact_strings=On

;enable apcu
extension=apcu.so
apc.serializer=igbinary
apc.enabled=1
apc.shm_size=64M
; WP-CLI (php CLI) needs this for the object cache drop-in; the CLI keeps its own private APCu memory
apc.enable_cli=1

;opcache for performance
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=24
opcache.max_accelerated_files=10000
; The code is baked into the image, so there is no need to stat files on every request.
; Set OPCACHE_VALIDATE_TIMESTAMPS=1 if you install/update plugins or themes from wp-admin
; or edit files in the wp-content volume, otherwise restart the container after changes.
opcache.validate_timestamps=${OPCACHE_VALIDATE_TIMESTAMPS:-0}
opcache.revalidate_freq=60
opcache.save_comments=0
opcache.enable_file_override=1
opcache.consistency_checks=0
; JIT gives next to nothing for I/O-bound WordPress, so keep it off
opcache.jit=disable
opcache.jit_buffer_size=0

; Compression is handled by nginx (gzip), don't compress twice in PHP
