worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    # Threat files with a unknown filetype as binary
    default_type application/octet-stream;

    log_format  main_timed  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            '$request_time $upstream_response_time $pipe $upstream_cache_status';

    access_log /dev/stdout main_timed;
    error_log /dev/stderr notice;

    keepalive_timeout 65;

    # Efficient static file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Cache open file descriptors and metadata of static files
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Hide headers that identify the server to prevent information leakage
    proxy_hide_header X-Powered-By;
    fastcgi_hide_header X-Powered-By;
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_proxied any;
    # Based on CloudFlare's recommended settings
    gzip_types text/richtext text/plain text/css text/x-script text/x-component text/x-java-source text/x-markdown application/javascript application/x-javascript text/javascript text/js image/x-icon image/vnd.microsoft.icon application/x-perl application/x-httpd-cgi text/xml application/xml application/rss+xml application/vnd.api+json application/x-protobuf application/json multipart/bag multipart/mixed application/xhtml+xml font/ttf font/otf font/x-woff image/svg+xml application/vnd.ms-fontobject application/ttf application/x-ttf application/otf application/x-otf application/truetype application/opentype application/x-opentype application/font-woff application/eot application/font application/font-sfnt application/wasm application/javascript-binast application/manifest+json application/ld+json application/graphql+json application/geo+json;
    gzip_vary on;
    
    # Enable Real IP to get the correct client IP address when behind a proxy or load balancer
    set_real_ip_from 10.0.0.0/8;                                                                                                                                                                
    set_real_ip_from 172.16.0.0/12;                                                                                                                                                             
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Forward the cloudfront scheme from upstream
    map "$http_cloudfront_forwarded_proto$http_x_forwarded_proto" $forwarded_scheme {
         default off;
         "~*(https)" on;
     }

    # ------------------------------------------------------------------
    # FastCGI page cache (anonymous visitors only)
    # ------------------------------------------------------------------
    fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WPCACHE:20m max_size=256m inactive=60m use_temp_path=off;
    fastcgi_cache_key "$forwarded_scheme$request_method$host$request_uri";

    # Never cache: non-GET/HEAD-style writes, requests with a query string,
    # admin/login/API endpoints and visitors with a WordPress/WooCommerce session cookie.
    map $request_method $nc_method {
        default 0;
        POST    1;
    }
    map $query_string $nc_query {
        default 1;
        ""      0;
    }
    map $request_uri $nc_uri {
        default 0;
        "~*(/wp-admin/|/wp-login\.php|/xmlrpc\.php|/wp-json/|/wp-cron\.php|/cart|/checkout|/my-account)" 1;
    }
    map $http_cookie $nc_cookie {
        default 0;
        "~*(comment_author|wordpress_logged_in|wp-postpass|wordpress_no_cache|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session)" 1;
    }
    map "$nc_method$nc_query$nc_uri$nc_cookie" $skip_cache {
        default 1;
        "0000"  0;
    }

    # ------------------------------------------------------------------
    # Rate limiting of brute-force targets. An empty key means "not limited".
    # ------------------------------------------------------------------
    map $uri $login_limit_key {
        default "";
        "~^/wp-login\.php$" $binary_remote_addr;
    }
    map $uri $xmlrpc_limit_key {
        default "";
        "~^/xmlrpc\.php$" $binary_remote_addr;
    }
    limit_req_zone $login_limit_key  zone=wplogin:10m  rate=20r/m;
    limit_req_zone $xmlrpc_limit_key zone=wpxmlrpc:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen [::]:80 default_server;
        listen 80 default_server;
        server_name _;

        # Increase proxy buffers for large requests
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Upload limit
        client_max_body_size 50m;
        client_body_buffer_size 128k;

        root /usr/src/wordpress;
        index index.php;

        include /etc/nginx/security-headers.conf;

        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Based on https://codeable.io/wordpress-developers-intro-to-docker-part-two/
        location /wp-content {
            root /var/www;
            expires 7d;
            add_header Cache-Control "public";
            include /etc/nginx/security-headers.conf;
        }

        # PHP-FPM ping, used by the container HEALTHCHECK (localhost only)
        location = /fpm-ping {
            access_log off;
            allow 127.0.0.1;
            deny all;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
        }

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to index.php
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            #fastcgi_intercept_errors on;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;

            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:9000;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Forward the scheme from upstream
            fastcgi_param HTTPS $forwarded_scheme;

            # Rate limit logins and XML-RPC (see zones above)
            limit_req zone=wplogin burst=10 nodelay;
            limit_req zone=wpxmlrpc burst=5 nodelay;

            # Page cache. Kept short because nothing purges it when content changes;
            # a short TTL also avoids a Cloudflare purge re-fetching a stale copy.
            fastcgi_cache WPCACHE;
            fastcgi_cache_valid 200 301 302 2m;
            fastcgi_cache_valid 404 1m;
            fastcgi_cache_use_stale error timeout updating http_500 http_503;
            fastcgi_cache_background_update on;
            fastcgi_cache_lock on;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            add_header X-FastCGI-Cache $upstream_cache_status;
            include /etc/nginx/security-headers.conf;
        }

        # deny access to . files, for security
        location ~ /\. {
            log_not_found off;
            deny all;
        }
    }
}
